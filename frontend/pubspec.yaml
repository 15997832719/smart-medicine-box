name: huiyao_app
description: 智能药箱——用AI语音和图像识别守护居家老人的用药安全

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1

  # 网络请求
  http: ^1.1.0
  http_parser: ^4.0.2

  # 本地存储
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0

  # 拍照和图片
  image_picker: ^1.0.4
  camera: ^0.10.5+5

  # 音频录制与播放
  record: ^6.0.0

  # 语音播报（TTS）
  flutter_tts: ^3.8.1
  speech_to_text: ^7.4.0

  # UI 组件
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # 工具
  intl: ^0.18.1
  permission_handler: ^11.0.1
  path_provider: ^2.1.1
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # 极光推送（可选）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
